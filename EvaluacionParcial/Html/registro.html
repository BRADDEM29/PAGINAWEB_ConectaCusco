<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrarse - Conecta Cusco</title>
	<meta name="description" content="Crea una nueva cuenta en Conecta Cusco para ofrecer o encontrar servicios.">
	<link rel="stylesheet" href="../Estilos/registro.css"> <link rel="icon" href="../Imagenes/favicon.ico" type="image/x-icon">
</head>
<body>
	<header>
		<div class="container">
			<div class="logo">
				<img src="../Imagenes/logo.png" alt="Conecta Cusco Logo">
			</div>
			<h1>Conecta Cusco</h1>
		</div>
	</header>

	<nav>
		<div class="container">
			<ul>
				<li><a href="HomeWork.html">Inicio</a></li>
				<li><a href="buscar-servicios.html">Buscar Servicios</a></li>
				<li><a href="publicar-servicios.html">Publicar mi Servicio</a></li>
				<li class="auth-links">
					<a href="login.html">Iniciar Sesión</a>
					<a href="registro.html">Registrarse</a> </li>
			</ul>
		</div>
	</nav>

	<main>
		<section class="auth-form">
			<div class="container">
				<h2>Crear una Nueva Cuenta</h2>
				<form action="/procesar-registro" method="post">
					<div class="form-group">
						<label for="name">Nombre Completo:</label>
						<input type="text" id="name" name="name" required>
					</div>
					<div class="form-group">
						<label for="email">Correo Electrónico:</label>
						<input type="email" id="email" name="email" required>
					</div>
					<div class="form-group">
						<label for="password">Contraseña:</label>
						<input type="password" id="password" name="password" required>
					</div>
					<div class="form-group">
						<label for="confirm-password">Confirmar Contraseña:</label>
						<input type="password" id="confirm-password" name="confirm-password" required>
					</div>
					<div class="form-group">
						<label>Tipo de Cuenta:</label><br>
						<input type="radio" id="type-client" name="account-type" value="client" checked>
						<label for="type-client">Busco Servicios (Cliente)</label><br>
						<input type="radio" id="type-professional" name="account-type" value="professional">
						<label for="type-professional">Ofrezco Servicios (Profesional)</label>
					</div>

					<button type="submit" class="btn-primary">Registrarse</button>
				</form>
				<p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión aquí</a>.</p>
			</div>
		</section>
	</main>

	<footer>
		<div class="container">
			<p>&copy; 2025 Conecta Cusco. Todos los derechos reservados.</p>
		</div>
	</footer>

	<script src="../js/script.js"></script>
</body>
</html>
