<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Iniciar Sesión - Conecta Cusco</title>
	<meta name="description" content="Inicia sesión en tu cuenta de Conecta Cusco para encontrar o gestionar servicios.">
	<link rel="stylesheet" href="../Estilos/login.css"> <link rel="icon" href="../Imagenes/favicon.ico" type="image/x-icon">
</head>
<body>
	<header>
		<div class="container">
			<div class="logo">
				<img src="../Imagenes/logo.png" alt="Conecta Cusco Logo">
			</div>
			<h1>Conecta Cusco</h1>
		</div>
	</header>

	<nav>
		<div class="container">
			<ul>
				<li><a href="HomeWork.html">Inicio</a></li>
				<li><a href="buscar-servicios.html">Buscar Servicios</a></li>
				<li><a href="publicar-servicios.html">Publicar mi Servicio</a></li>
				<li class="auth-links">
					<a href="login.html">Iniciar Sesión</a> <a href="registro.html">Registrarse</a>
				</li>
			</ul>
		</div>
	</nav>

	<main>
		<section class="auth-form">
			<div class="container">
				<h2>Iniciar Sesión</h2>
				<form action="/procesar-login" method="post">
					<div class="form-group">
						<label for="email">Correo Electrónico:</label>
						<input type="email" id="email" name="email" required>
					</div>
					<div class="form-group">
						<label for="password">Contraseña:</label>
						<input type="password" id="password" name="password" required>
					</div>
					<button type="submit" class="btn-primary">Entrar</button>
				</form>
				<p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
			</div>
		</section>
	</main>

	<footer>
		<div class="container">
			<p>&copy; 2025 Conecta Cusco. Todos los derechos reservados.</p>
		</div>
	</footer>

	
</body>
</html>
